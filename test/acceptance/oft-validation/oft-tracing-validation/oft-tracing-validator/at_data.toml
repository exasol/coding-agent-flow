[[scenario]]
id = "scn~oft-requirement-covers-feature~1"
description = "Return valid when an OFT Requirement covers the OFT Feature that needs it"

[[scenario.given.file]]
path = "features.md"
content = '''
# Valid Fixture Feature

feat~valid-fixture-feature~1

Needs: req
'''

[[scenario.given.file]]
path = "requirements.md"
content = '''
# Valid Fixture Requirement

req~valid-fixture-requirement~1

Covers:

- feat~valid-fixture-feature~1
'''

[scenario.then]
valid = true

[[scenario]]
id = "scn~oft-requirement-does-not-cover-feature~1"
description = "Return invalid when an OFT Feature that needs an OFT Requirement stays uncovered"

[[scenario.given.file]]
path = "features.md"
content = '''
# Invalid Fixture Feature

feat~invalid-fixture-feature~1

Needs: req
'''

[scenario.then]
valid = false
