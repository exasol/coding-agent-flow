[variables]
requirement_document = '''
OFT Requirement document
========================

{{req_id}}
'''

[[scenario]]
id = "scn~oft-requirements-detection~1"
description = "Detect OFT Requirements by file location and extension: doc/requirements/requirements.rst"

[scenario.given]
location = "doc/requirements/requirements.rst"
req_id = "req~valid-doc-requirements-rst~1"

[[scenario.given.file]]
path = "{{location}}"
content = "${requirement_document}"

[scenario.then]
found = true

[[scenario]]
id = "scn~oft-requirements-detection~1"
description = "Detect OFT Requirements by file location and extension: requirements.rst"

[scenario.given]
location = "requirements.rst"
req_id = "req~valid-root-rst~1"

[[scenario.given.file]]
path = "{{location}}"
content = "${requirement_document}"

[scenario.then]
found = true

[[scenario]]
id = "scn~oft-requirements-detection~1"
description = "Detect OFT Requirements by file location and extension: requirements.md"

[scenario.given]
