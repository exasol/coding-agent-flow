name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch OpenFastTrace
        run: >-
          mvn --batch-mode org.apache.maven.plugins:maven-dependency-plugin:3.11.0:get
          -Dartifact=org.itsallcode.openfasttrace:openfasttrace:4.11.0 -Dtransitive=false

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test . ./internal/...

      - name: OFT trace
        run: >-
          java -jar ~/.m2/repository/org/itsallcode/openfasttrace/openfasttrace/4.11.0/openfasttrace-4.11.0.jar
          trace doc internal test oft_validation.go

      - name: Acceptance tests
        run: go test ./test/acceptance/...

  # This job ensures inputs have been executed successfully.
  allow-merge:
    name: Allow Merge
    needs:
      - build
    if: ${{ always() }}
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read

    steps:
      - name: Require successful build
        run: test "${{ needs.build.result }}" = "success"

      - name: Branch Protection
        run: echo "All required checks passed. Merge allowed."

